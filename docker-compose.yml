services:
  postgres:
    image: postgres:16-alpine
    container_name: finedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finedu
      POSTGRES_PASSWORD: finedu
      POSTGRES_DB: finedu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
